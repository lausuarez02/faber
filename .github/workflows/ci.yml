name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated files are up to date
        run: |
          pnpm gen
          git diff --exit-code || {
            echo "::error::Generated files are out of date. Run 'pnpm gen' locally and commit the result."
            exit 1
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the Arduino toolchain images (used by firmware build tests)
        run: pnpm exec tsx -e "import('./services/runner/src/docker.ts').then(m => m.ensureImage(console.log))"

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @jumper/web exec playwright install --with-deps chromium

      - name: Browser tests (desktop + mobile)
        run: pnpm test:e2e --reporter=github,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
