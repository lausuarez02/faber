<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Jumper: Figma for hardware, with a real simulator underneath.">
  <title>Jumper</title>
  <defs>
    <pattern id="jumper-card-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#2A3039"/>
    </pattern>
    <radialGradient id="jumper-card-glow">
      <stop offset="0" stop-color="#5CF2A1" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#5CF2A1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5CF2A1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .display { font-family: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif; font-weight: 800; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .ui { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="#0D0F12"/>
  <rect width="1200" height="630" fill="url(#jumper-card-grid)"/>

  <!-- wordmark -->
  <g transform="translate(72 64) scale(1.25)">
    <path d="M43 21 V44 A11 11 0 0 1 21 44 V45" fill="none" stroke="#FF4D2E" stroke-width="9"/>
    <rect x="41.5" y="1" width="3" height="6" fill="#8A93A0"/>
    <rect x="19.5" y="25" width="3" height="6" fill="#8A93A0"/>
    <rect x="35.5" y="6" width="15" height="17" rx="2.5" fill="#E9EDF2"/>
    <rect x="13.5" y="30" width="15" height="17" rx="2.5" fill="#E9EDF2"/>
    <rect x="40" y="10" width="6" height="3" rx="1" fill="#0D0F12" opacity=".28"/>
    <rect x="18" y="34" width="6" height="3" rx="1" fill="#0D0F12" opacity=".28"/>
    <text class="display" x="64" y="47" font-size="52" letter-spacing="-1.5" fill="#E9EDF2">jumper</text>
  </g>

  <!-- headline -->
  <text class="display" x="80" y="300" font-size="66" letter-spacing="-2" fill="#E9EDF2">Figma for hardware,</text>
  <text class="display" x="80" y="372" font-size="66" letter-spacing="-2" fill="#8A93A0">with a real simulator</text>
  <text class="display" x="80" y="444" font-size="66" letter-spacing="-2" fill="#8A93A0">underneath.</text>

  <text class="ui" x="80" y="530" font-size="24" fill="#E9EDF2">Wire it, flash real firmware, watch it run. In the browser.</text>
  <text class="mono" x="80" y="572" font-size="18" fill="#8A93A0">open source · Apache-2.0 · Arduino Uno on avr8js</text>

  <!-- the circuit: Uno header → 220 Ω → LED → GND -->
  <g transform="translate(764 140)">
    <!-- header strip -->
    <rect x="0" y="0" width="96" height="236" rx="10" fill="#1C2027" stroke="#262B33" stroke-width="2"/>
    <g class="mono" font-size="15" fill="#8A93A0">
      <text x="16" y="45">D11</text>
      <text x="16" y="85">D12</text>
      <text x="16" y="125" fill="#5CF2A1">D13</text>
      <text x="16" y="165">GND</text>
      <text x="16" y="205">5V</text>
    </g>
    <g fill="#0D0F12" stroke="#3A414C" stroke-width="2">
      <rect x="62" y="30" width="20" height="20" rx="3"/>
      <rect x="62" y="70" width="20" height="20" rx="3"/>
      <rect x="62" y="110" width="20" height="20" rx="3"/>
      <rect x="62" y="150" width="20" height="20" rx="3"/>
      <rect x="62" y="190" width="20" height="20" rx="3"/>
    </g>
    <circle cx="72" cy="120" r="4" fill="#5CF2A1"/>

    <!-- red jumper: D13 → resistor -->
    <path d="M72 120 C 150 120, 170 40, 250 40" fill="none" stroke="#FF4D2E" stroke-width="7" stroke-linecap="round"/>
    <!-- resistor -->
    <line x1="250" y1="40" x2="330" y2="40" stroke="#B9C0CA" stroke-width="3"/>
    <rect x="262" y="28" width="56" height="24" rx="11" fill="#D9C7A3"/>
    <rect x="272" y="28" width="5" height="24" fill="#B4281C"/>
    <rect x="282" y="28" width="5" height="24" fill="#B4281C"/>
    <rect x="292" y="28" width="5" height="24" fill="#5A3A22"/>
    <rect x="306" y="28" width="4" height="24" fill="#C9A43A"/>
    <text class="mono" x="290" y="80" font-size="14" fill="#8A93A0" text-anchor="middle">220 Ω</text>
    <!-- resistor → LED anode -->
    <path d="M330 40 C 400 40, 400 196, 330 196" fill="none" stroke="#FF4D2E" stroke-width="7" stroke-linecap="round"/>

    <!-- LED, lit -->
    <circle cx="322" cy="150" r="92" fill="url(#jumper-card-glow)"/>
    <line x1="330" y1="150" x2="330" y2="196" stroke="#B9C0CA" stroke-width="3"/>
    <line x1="314" y1="150" x2="314" y2="206" stroke="#B9C0CA" stroke-width="3"/>
    <path d="M300 156 V128 A22 22 0 0 1 344 128 V156 Z" fill="#5CF2A1"/>
    <rect x="296" y="152" width="52" height="8" rx="2" fill="#5CF2A1"/>
    <path d="M309 126 A12 12 0 0 1 320 116" fill="none" stroke="#E9FFF3" stroke-width="3" stroke-linecap="round" opacity=".8"/>

    <!-- LED cathode → GND -->
    <path d="M314 206 C 314 250, 160 160, 72 160" fill="none" stroke="#4A515C" stroke-width="7" stroke-linecap="round"/>
    <circle cx="72" cy="160" r="4" fill="#8A93A0"/>

    <!-- status chip -->
    <g transform="translate(0 290)">
      <rect width="336" height="40" rx="20" fill="#15181D" stroke="#262B33" stroke-width="2"/>
      <circle cx="22" cy="20" r="6" fill="#5CF2A1"/>
      <text class="mono" x="38" y="26" font-size="16" fill="#E9EDF2">running · 16 MHz · t=1.000 s</text>
    </g>
  </g>
</svg>
