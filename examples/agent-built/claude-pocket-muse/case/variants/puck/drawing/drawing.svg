<text class="s" x="262" y="86.19999999999999">TOLERANCES</text>
<text class="s" x="262" y="90.19999999999999">General ±0.2 mm. Clearance between mating parts 0.2 mm (fdm). Holes are drawn at size + clearance.</text>
<text class="s" x="262" y="93.99999999999999">Check the screen window and the USB openings against the real modules before a production run.</text>
<text class="s" x="262" y="99.79999999999998">MATERIAL / FINISH</text>
<text class="s" x="262" y="103.79999999999998">PLA (easy) or PETG (tougher, better for snap lips and belt clips); matte PLA hides layer lines.</text>
<text class="s" x="262" y="107.59999999999998">Optional: sand 240 → 400, filler primer, paint; or print the front in a contrasting colour.</text>
<text class="s" x="262" y="111.39999999999998">Light pipes: clear PETG or clear resin. Button plungers: PETG or PLA.</text>
<text class="s" x="262" y="117.19999999999997">PRINT SETTINGS</text>
<text class="s" x="262" y="121.19999999999997">Nozzle 0.4 mm, layer 0.16 to 0.2 mm, 4 perimeters (walls print solid), 20 % gyroid infill, 5 top / bottom layers.</text>
<text class="s" x="262" y="124.99999999999997">Each shell prints open side up on its outer face (a domed face stands on its flat land / pad): no supports needed except where this file says.</text>
<text class="s" x="262" y="128.79999999999998">Brim 3 mm on rounded shapes (the rounded edge leaves a small first-layer footprint). First layer slow (20 mm/s). Clearances in this file: 0.2 mm.</text>
