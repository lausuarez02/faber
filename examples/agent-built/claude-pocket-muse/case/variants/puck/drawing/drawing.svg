<text class="t" x="262" y="33">Case: puck, 72.7 x 72.7 x 25.0 mm (W x H x D), inner 69.5 x 69.5 x 21.8 mm</text>
<text class="t" x="262" y="37.6">Wall 1.6 mm (measured min 1.60 mm), edge radius 8.5 mm front, 6.8 mm back (rounded in 3D all round), split 15.6 mm from the front</text>
<text class="t" x="262" y="42.2">Closure: snap lip 1.0 x 2.0 mm, bead 0.3 mm into a 0.4 mm groove</text>
<text class="t" x="262" y="46.800000000000004">Shell mass about 22 g (PLA)</text>
<text class="s" x="262" y="53.400000000000006">OPENINGS (case frame, origin = centre of the outer box; +x right, +y up, +z out of the front)</text>
