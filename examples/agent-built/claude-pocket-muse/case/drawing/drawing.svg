<text class="b" x="262" y="26">Pocket Muse</text>
<text class="t" x="262" y="33">Case: pebble, 65.9 x 73.6 x 24.7 mm (W x H x D), inner 62.7 x 70.4 x 21.5 mm</text>
<text class="t" x="262" y="37.6">Wall 1.6 mm (measured min 1.60 mm), edge radius 0.8 mm, split 14.1 mm from the front</text>
<text class="t" x="262" y="42.2">Closure: snap lip 1.0 x 2.0 mm, bead 0.3 mm into a 0.4 mm groove</text>
<text class="t" x="262" y="46.800000000000004">Shell mass about 24 g (PLA)</text>
<text class="s" x="262" y="53.400000000000006">OPENINGS (case frame, origin = centre of the outer box; +x right, +y up, +z out of the front)</text>
<text class="m" x="262" y="57.400000000000006">part.feature            face     centre x, y, z          size</text>
<text class="m" x="262" y="61.400000000000006">eye.active-area         front    0.0, -4.2, 10.8         Ø33.0</text>
<text class="m" x="262" y="65.2">chg.usb                 bottom   0.0, -35.2, 0.4         12.0 x 6.3</text>
<text class="m" x="262" y="69">xiao.usb                bottom   0.0, -35.2, -7.9        12.0 x 6.2</text>
<text class="m" x="262" y="72.8">pwr.lever               top      0.0, 35.2, 1.5          3.9 x 1.9</text>
<text class="m" x="262" y="76.6">pet.cap                 right    26.6, -26.5, 7.8        Ø3.9</text>
<text class="m" x="262" y="80.39999999999999">squeak.sound            back     16.3, -12.2, -10.7      Ø8.0 (7 x Ø1.5)</text>
<text class="s" x="262" y="86.19999999999999">TOLERANCES</text>
<text class="s" x="262" y="90.19999999999999">General ±0.2 mm. Clearance between mating parts 0.2 mm (fdm). Holes are drawn at size + clearance.</text>
<text class="s" x="262" y="93.99999999999999">Check the screen window and the USB openings against the real modules before a production run.</text>
<text class="s" x="262" y="99.79999999999998">MATERIAL / FINISH</text>
<text class="s" x="262" y="103.79999999999998">PLA (easy) or PETG (tougher, better for snap lips and belt clips); matte PLA hides layer lines.</text>
<text class="s" x="262" y="107.59999999999998">Optional: sand 240 → 400, filler primer, paint; or print the front in a contrasting colour.</text>
<text class="s" x="262" y="111.39999999999998">Light pipes: clear PETG or clear resin. Button plungers: PETG or PLA.</text>
<text class="s" x="262" y="117.19999999999997">PRINT SETTINGS</text>
<text class="s" x="262" y="121.19999999999997">Nozzle 0.4 mm, layer 0.16 to 0.2 mm, 4 perimeters (walls print solid), 20 % gyroid infill, 5 top / bottom layers.</text>
<text class="s" x="262" y="124.99999999999997">Each shell prints open side up on its outer face: no supports needed except where PRINT.md says.</text>
<text class="s" x="262" y="128.79999999999998">Brim 3 mm on rounded shapes (small first-layer footprint). First layer slow (20 mm/s). Clearances in this file: 0.2 mm.</text>
