<text class="b" x="262" y="26">Pocket Muse</text>
<text class="t" x="262" y="33">Case: pebble, 76.3 x 70.3 x 25.0 mm (W x H x D), inner 73.1 x 67.1 x 21.8 mm</text>
<text class="t" x="262" y="37.6">Wall 1.6 mm (measured min 1.60 mm), edge radius 1.1 mm, split 14.1 mm from the front</text>
<text class="t" x="262" y="42.2">Closure: snap lip 1.0 x 2.0 mm, bead 0.3 mm into a 0.4 mm groove</text>
<text class="t" x="262" y="46.800000000000004">Shell mass about 27 g (PLA)</text>
<text class="s" x="262" y="53.400000000000006">OPENINGS (case frame, origin = centre of the outer box; +x right, +y up, +z out of the front)</text>
<text class="m" x="262" y="57.400000000000006">part.feature            face     centre x, y, z          size</text>
<text class="m" x="262" y="61.400000000000006">eye.active-area         front    0.0, -5.5, 10.9         Ø33.0</text>
<text class="m" x="262" y="65.2">chg.usb                 bottom   0.0, -33.5, 0.6         12.0 x 6.3</text>
<text class="m" x="262" y="69">xiao.usb                bottom   0.0, -33.5, -7.7        12.0 x 6.2</text>
<text class="m" x="262" y="72.8">pet.cap                 right    30.4, -27.8, 7.9        Ø3.9</text>
<text class="m" x="262" y="76.6">squeak.sound            back     18.0, -5.5, -10.9       Ø8.0 (7 x Ø1.5)</text>
<text class="s" x="262" y="82.39999999999999">TOLERANCES</text>
<text class="s" x="262" y="86.39999999999999">General ±0.2 mm. Clearance between mating parts 0.2 mm (fdm). Holes are drawn at size + clearance.</text>
<text class="s" x="262" y="90.19999999999999">Check the screen window and the USB openings against the real modules before a production run.</text>
<text class="s" x="262" y="95.99999999999999">MATERIAL / FINISH</text>
<text class="s" x="262" y="99.99999999999999">PLA (easy) or PETG (tougher, better for snap lips and belt clips); matte PLA hides layer lines.</text>
<text class="s" x="262" y="103.79999999999998">Optional: sand 240 → 400, filler primer, paint; or print the front in a contrasting colour.</text>
<text class="s" x="262" y="107.59999999999998">Light pipes: clear PETG or clear resin. Button plungers: PETG or PLA.</text>
<text class="s" x="262" y="113.39999999999998">PRINT SETTINGS</text>
<text class="s" x="262" y="117.39999999999998">Nozzle 0.4 mm, layer 0.16 to 0.2 mm, 4 perimeters (walls print solid), 20 % gyroid infill, 5 top / bottom layers.</text>
<text class="s" x="262" y="121.19999999999997">Each shell prints open side up on its outer face: no supports needed except where PRINT.md says.</text>
<text class="s" x="262" y="124.99999999999997">Brim 3 mm on rounded shapes (small first-layer footprint). First layer slow (20 mm/s). Clearances in this file: 0.2 mm.</text>
