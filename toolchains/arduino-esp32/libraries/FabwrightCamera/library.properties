name=FabwrightCamera
version=0.1.0
author=Fabwright Authors
maintainer=Fabwright Authors
sentence=Simulation build support for esp32-camera sketches in Fabwright: frames come from Fabwright instead of the camera sensor.
paragraph=Added by Fabwright to simulation builds only (FABWRIGHT_SIM=1) of sketches that include esp_camera.h. The esp32-camera API (esp_camera_init, esp_camera_fb_get, esp_camera_fb_return, esp_camera_sensor_get and the sensor_t settings) is wrapped at link time; frames come from Fabwright's camera port in the emulator. The real-device build uses Espressif's esp32-camera driver unchanged. Apache-2.0.
category=Device Control
url=https://github.com/espressif/esp32-camera
architectures=esp32
