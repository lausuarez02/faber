name=JumperCamera
version=0.1.0
author=Jumper Authors
maintainer=Jumper Authors
sentence=Simulation build support for esp32-camera sketches in Jumper: frames come from Jumper instead of the camera sensor.
paragraph=Added by Jumper to simulation builds only (JUMPER_SIM=1) of sketches that include esp_camera.h. The esp32-camera API (esp_camera_init, esp_camera_fb_get, esp_camera_fb_return, esp_camera_sensor_get and the sensor_t settings) is wrapped at link time; frames come from Jumper's camera port in the emulator. The real-device build uses Espressif's esp32-camera driver unchanged. Apache-2.0.
category=Device Control
url=https://github.com/espressif/esp32-camera
architectures=esp32
