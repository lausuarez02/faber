name=FabwrightSleep
version=0.1.0
author=Fabwright Authors
maintainer=Fabwright Authors
sentence=Simulation build support for deep-sleep sketches in Fabwright: esp_deep_sleep_start() hands the board to Fabwright, which wakes it on its timer or wake pins.
paragraph=Added by Fabwright to simulation builds only (FABWRIGHT_SIM=1) of sketches that call esp_deep_sleep / esp_deep_sleep_start. The sleep API is wrapped at link time; RTC memory (RTC_DATA_ATTR), the system time and the wake cause survive the sleep as on the chip. The real-device build uses ESP-IDF's sleep code unchanged. MIT.
category=Device Control
url=https://docs.espressif.com/projects/esp-idf/en/stable/esp32/api-reference/system/sleep_modes.html
architectures=esp32
